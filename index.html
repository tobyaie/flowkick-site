<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowKick</title>
<meta name="description" content="FlowKick's privacy policy, terms of use and open-source licences.">
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #555; --bg: #fff; --line: #ddd; --green: #16A34A; --link: #15803D; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --muted: #aaa; --bg: #121212; --line: #333; --link: #4ADE80; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 .5rem; border-bottom: 4px solid var(--green); display: inline-block; padding-bottom: .2rem; }
  a { color: var(--link); }
  a:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  ul.links { list-style: none; padding: 0; margin: 1.5rem 0; }
  ul.links li { border-top: 1px solid var(--line); }
  ul.links li:last-child { border-bottom: 1px solid var(--line); }
  ul.links a { display: block; padding: .9rem 0; font-size: 1.1rem; font-weight: 600; }
  p.muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>FlowKick</h1>
  <p>FlowKick is a freestyle football juggling app for iPhone. It counts your touches with the camera, right on your phone.</p>
  <ul class="links">
    <li><a href="privacy/">Privacy Policy</a></li>
    <li><a href="terms/">Terms of Use</a></li>
    <li><a href="licences/">Open-source licences</a></li>
  </ul>
  <p class="muted">Questions: CONTACT_EMAIL_TBD</p>
</main>
</body>
</html>
